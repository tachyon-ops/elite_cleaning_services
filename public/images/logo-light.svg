<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <!-- Icon Part -->
  <g transform="translate(10, 10)">
    <!-- Elegant outer circle -->
    <circle cx="40" cy="40" r="38" fill="none" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
    <circle cx="40" cy="40" r="34" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    
    <!-- Monogram M -->
    <path d="M 24,52 V 28 L 40,44 L 56,28 V 52" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Gold Sparkles -->
    <path d="M 52,24 Q 56,24 56,20 Q 56,24 60,24 Q 56,24 56,28 Q 56,24 52,24 Z" fill="#d4af37"/>
    <path d="M 22,46 Q 24,46 24,44 Q 24,46 26,46 Q 24,46 24,48 Q 24,46 22,46 Z" fill="#d4af37" opacity="0.8"/>
  </g>
  
  <!-- Typography Part -->
  <g transform="translate(110, 52)">
    <!-- MONDAR Main text -->
    <text x="0" y="0" font-family="'Playfair Display', 'Didot', 'Georgia', serif" font-size="36" font-weight="600" letter-spacing="0.18em" fill="#ffffff">MONDAR</text>
    <!-- Subtitle -->
    <text x="3" y="24" font-family="'Inter', sans-serif" font-size="10" font-weight="600" letter-spacing="0.4em" fill="#d4af37">SWISS SPECIALTY</text>
  </g>
</svg>
